name: video_editor_app
description: A basic CapCut-style mobile video editor.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Local persistence (Project data model)
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0

  # Media import & permissions
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  file_picker: ^8.0.3

  # Preview playback (smooth scrubbing — NOT used for final export)
  video_player: ^2.9.1

  # Thumbnails
  video_thumbnail: ^0.5.3

  # Final compositing / export pipeline
  ffmpeg_kit_flutter: ^6.0.3

  # IDs
  uuid: ^4.4.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.16.0
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
